services:
  mongodb:
    image: mongo:8.0
    container_name: biblioteca-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-biblioteca123}
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
